{% extends "coordinador/navbarcoor.html" %}
{% block title %}Inspecciones — BI{% endblock %}

{% block head %}
<style>
.bi-wrap {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 60px);
    background: #f1f5f9;
}
.bi-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    flex-shrink: 0;
}
.bi-header-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg,#7c3aed,#6d28d9);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1rem;
}
.bi-header-title { font-size: 1rem; font-weight: 700; color: #0f172a; margin: 0; }
.bi-header-sub   { font-size: .75rem; color: #64748b; margin: 0; }
.bi-back {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 8px;
    background: #f8fafc; border: 1px solid #e2e8f0;
    color: #64748b; font-size: .8rem; font-weight: 600;
    text-decoration: none; transition: background .15s;
}
.bi-back:hover { background: #e2e8f0; color: #1e293b; }
.bi-frame-wrap {
    flex: 1;
    padding: 12px 16px;
    overflow: hidden;
}
.bi-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.10);
    background: #fff;
}
</style>
{% endblock %}

{% block content %}
<div class="bi-wrap">
    <div class="bi-header">
        <div class="bi-header-icon"><i class="bi bi-search"></i></div>
        <div>
            <p class="bi-header-title">Inspecciones</p>
            <p class="bi-header-sub">Informe BI — Hesego Ingeniería SAS</p>
        </div>
        <a href="{{ url_for('coordinador.dashboard_coordinador') }}" class="bi-back">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>
    <div class="bi-frame-wrap">
        <iframe
            title="Inspecciones BI Hesego Ingenieria SAS"
            src="https://app.powerbi.com/view?r=eyJrIjoiYWYwYmRhZWQtOWYzNC00OWYxLWJkM2MtZGU5ZTk5MDU4ZTMxIiwidCI6ImU1NjkzYWJkLWViMTEtNDk5Mi05OGE5LThhNjRhODJkNTRhYiJ9"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>
</div>
{% endblock %}
